name: Aviator Merge Queue & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  aviator-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run build check
        run: bun run build
        env:
          AVIATOR_API_TOKEN: ${{ secrets.AVIATOR_API_TOKEN || 'av_live_aea3cb3a6667417599aad7f36a7b04b2' }}

      - name: Verify Aviator API Authentication
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.AVIATOR_API_TOKEN || 'av_live_aea3cb3a6667417599aad7f36a7b04b2' }}" \
               -H "Content-Type: application/json" \
               https://api.aviator.co/api/v1/branches || true
