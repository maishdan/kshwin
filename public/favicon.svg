<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <!-- Background Icon shape -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#accent)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- KSH WIN Logo Design: Modern stylized 'K' merged with aviator wing & growth chart -->
  <g transform="translate(40, 30)">
    <!-- Vertical stem of K -->
    <path d="M120 100 L120 380 Q120 395 135 395 L165 395 Q180 395 180 380 L180 100 Q180 85 165 85 L135 85 Q120 85 120 100 Z" fill="url(#gold)"/>

    <!-- Top diagonal wing -->
    <path d="M170 250 L290 120 Q305 105 325 120 L345 140 Q360 155 345 170 L235 285 Z" fill="url(#accent)"/>

    <!-- Bottom diagonal leg / chart arrow -->
    <path d="M210 260 L320 375 Q335 390 355 380 L370 365 Q385 350 370 335 L265 230 Z" fill="url(#gold)"/>

    <!-- Small Aviator Star Accent -->
    <polygon points="360,110 370,130 392,132 375,147 380,168 360,156 340,168 345,147 328,132 350,130" fill="#fef08a"/>
  </g>
</svg>
